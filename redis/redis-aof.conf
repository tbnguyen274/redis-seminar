# Redis AOF-only demo - generated runtime paths are substituted by run_trials.py.
# Do not launch this template directly; use the generated trial config.
bind 127.0.0.1
protected-mode yes
port 6381
daemonize yes
supervised no
pidfile @PID_FILE@
logfile @LOG_FILE@
dir @DATA_DIR@

# Disable RDB snapshots so the storage mechanisms are separated.
save ""
appendonly yes
appendfsync everysec
appenddirname appendonlydir
appendfilename appendonly.aof

# No AOF rewrite during measurements; useful for reproducibility.
auto-aof-rewrite-percentage 0
