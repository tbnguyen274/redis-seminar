# Redis RDB-only demo - generated runtime paths are substituted by run_trials.py.
# Do not launch this template directly; use the generated trial config.
bind 127.0.0.1
protected-mode yes
port 6380
daemonize yes
supervised no
pidfile @PID_FILE@
logfile @LOG_FILE@
dir @DATA_DIR@

# No implicit snapshot: the demo performs one controlled BGSAVE.
save ""
appendonly no
dbfilename dump.rdb

# Isolated lab only; do not enable network access.
